<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Political Compass 2.0</title>
    <meta name="description" content="A political compass you answer in your own words, read by Jev." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header>
      <span id="title"></span>
      <button id="language" class="quiet" type="button"></button>
    </header>

    <main>
      <section id="question" hidden>
        <p id="progress" class="muted"></p>
        <p id="statement"></p>
        <textarea id="reply" rows="4" maxlength="600" aria-labelledby="statement"></textarea>
        <p id="hint" class="muted"></p>
        <div class="actions">
          <button id="back" class="quiet" type="button"></button>
          <button id="finish-early" class="quiet" type="button"></button>
          <span class="spacer"></span>
          <button id="skip" class="quiet" type="button"></button>
          <button id="next" type="button"></button>
        </div>
      </section>

      <section id="key" hidden>
        <p id="key-prompt"></p>
        <form id="key-form" class="actions">
          <input id="key-input" type="password" placeholder="sk-or-…" autocomplete="off" required />
          <button id="key-save" type="submit"></button>
        </form>
      </section>

      <section id="reading" hidden>
        <p id="reading-text" class="muted"></p>
      </section>

      <section id="failure" hidden>
        <p id="failure-text"></p>
        <div class="actions">
          <button id="failure-back" class="quiet" type="button"></button>
          <button id="retry" type="button"></button>
        </div>
      </section>

      <section id="result" hidden>
        <svg id="compass" role="img"></svg>
        <svg id="social" role="img"></svg>
        <p id="scores"></p>
        <p id="counted" class="muted"></p>
        <div class="actions">
          <button id="restart" class="quiet" type="button"></button>
          <span class="spacer"></span>
          <button id="edit" type="button"></button>
        </div>
        <ol id="readings"></ol>
      </section>
    </main>

    <footer>
      <p id="privacy" class="muted"></p>
    </footer>
  </body>
</html>
